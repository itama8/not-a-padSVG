name: Build and deploy site

# main -> https://itama8.github.io/not-a-padSVG/
# dev  -> https://itama8.github.io/not-a-padSVG/dev/  (not indexed by search engines)
# A push to either branch rebuilds both, so neither overwrites the other.

on:
  push:
    branches: [main, dev]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          path: main
      - name: Check out dev
        id: dev
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: dev
          path: dev
      - name: Assemble the site
        env:
          WANT_COUNTER_SOCKET: ${{ vars.WANT_COUNTER_SOCKET }}
        run: |
          mkdir -p _site
          cp -R main/site/. _site/
          if [ -d dev/site ]; then
            mkdir -p _site/dev
            cp -R dev/site/. _site/dev/
            # keep work in progress out of search results
            find _site/dev -name '*.html' -exec sed -i 's#<head>#<head>\n  <meta name="robots" content="noindex" />#' {} +
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          endpoint = os.environ["WANT_COUNTER_SOCKET"]
          if endpoint:
              for config in Path("_site").glob("**/want-config.js"):
                  config.write_text(f"window.wantCounterSocket = {json.dumps(endpoint)};\n")
          PY
          echo "main: $(git -C main rev-parse --short HEAD)" > _site/version.txt
          [ -d dev ] && echo "dev: $(git -C dev rev-parse --short HEAD)" >> _site/version.txt
          cat _site/version.txt
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
