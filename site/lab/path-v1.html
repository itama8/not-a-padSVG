<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>not-padgtp path lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<style>
/* Layout: one screen. A plane of tiles behind a viewport, an x-ray overlay above it, and a drawn typing surface under it. */
:root {
  --paper: #e7eae4;
  --tile: #f3f4f0;
  --ink: #1b201d;
  --live: #5443d4;
  --bad: #b3372b;
  --text: "Literata", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --ease: cubic-bezier(.23, 1, .32, 1);
  --spring: cubic-bezier(.2, 1.5, .4, 1);
  --text-size: 19px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #111412; --tile: #181c19; --ink: #dce1d8; --live: #a99dff; --bad: #f08a7c; color-scheme: dark; }
}
:root[data-theme="dark"] { --paper: #111412; --tile: #181c19; --ink: #dce1d8; --live: #a99dff; --bad: #f08a7c; color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); overscroll-behavior: none; font-family: var(--mono); }

#app {
  height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 6px;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
.brand { display: flex; align-items: center; gap: 10px; }
.logo { height: 40px; width: auto; overflow: visible; }
.logo text { font-family: var(--mono); font-size: 10px; fill: var(--live); }
.brand-name { font-size: 12px; letter-spacing: .04em; opacity: .75; }
.hint { font-size: 11px; opacity: .6; text-align: right; max-width: 34ch; line-height: 1.35; }
.hint b { font-weight: 500; opacity: 1; }

#view { flex: 1; min-height: 0; position: relative; overflow: hidden; touch-action: none; cursor: crosshair; }
#plane { position: absolute; left: 0; top: 0; transform-origin: 0 0; transition: transform .42s var(--ease); }

.tile {
  --mark: color-mix(in srgb, var(--ink) 30%, transparent);
  position: absolute; box-sizing: border-box; padding: 26px 24px 20px;
  display: flex; flex-direction: column;
  transition: left .42s var(--ease), top .42s var(--ease), opacity .2s;
  background:
    linear-gradient(var(--mark), var(--mark)) left top / 10px 1px no-repeat,
    linear-gradient(var(--mark), var(--mark)) left top / 1px 10px no-repeat,
    linear-gradient(var(--mark), var(--mark)) right top / 10px 1px no-repeat,
    linear-gradient(var(--mark), var(--mark)) right top / 1px 10px no-repeat,
    linear-gradient(var(--mark), var(--mark)) left bottom / 10px 1px no-repeat,
    linear-gradient(var(--mark), var(--mark)) left bottom / 1px 10px no-repeat,
    linear-gradient(var(--mark), var(--mark)) right bottom / 10px 1px no-repeat,
    linear-gradient(var(--mark), var(--mark)) right bottom / 1px 10px no-repeat,
    var(--tile);
}
.tile.focused { --mark: var(--ink); }
.tile-head { display: none; font-family: var(--text); font-size: calc(17px / var(--s, 1)); line-height: 1.3; }
.tile-body {
  flex: 1; min-height: 0; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere;
  font-family: var(--text); font-size: var(--text-size); line-height: 1.6;
}
.caret {
  display: inline-block; width: 2px; height: 1.15em; margin-bottom: -.22em; margin-left: 1px;
  background: var(--live); animation: blink 1.06s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
.testing .tile .caret { display: none; }
#view.map .tile-body { display: none; }
#view.map .tile-head { display: block; }
.quiet #plane .tile { opacity: .5; }

#testBar { padding: 10px 2px 4px; display: grid; gap: 6px; }
#testBar .target { font-family: var(--text); font-size: 18px; line-height: 1.45; }
#testBar .target .ok { opacity: .35; }
#testBar .target .bad { color: var(--bad); text-decoration: underline; }
#testBar .target .next { box-shadow: inset 0 -1.5px var(--live); }
#testBar .typed { font-family: var(--text); font-size: 18px; min-height: 1.5em; white-space: pre-wrap; overflow-wrap: anywhere; }
#testBar .summary { font-size: 11px; opacity: .65; }

#suggest { display: flex; gap: 6px; min-height: 30px; align-items: center; justify-content: center; }
.chip {
  font: 500 14px var(--text); color: var(--ink); background: none; border: 0; padding: 4px 12px;
  position: relative; cursor: pointer; touch-action: manipulation;
}
.chip::before, .chip::after { content: ""; position: absolute; bottom: 2px; width: 6px; height: 6px; border-bottom: 1px solid var(--live); }
.chip::before { left: 2px; border-left: 1px solid var(--live); }
.chip::after { right: 2px; border-right: 1px solid var(--live); }

#surface { height: clamp(210px, 38vh, 330px); touch-action: none; position: relative; }
#surface svg { display: block; width: 100%; height: 100%; }
.cell .ticks { fill: none; stroke: var(--ink); opacity: .22; transition: opacity .1s; }
.cell .reg { stroke: var(--ink); opacity: .12; }
.cell text { font-family: var(--mono); fill: var(--ink); text-anchor: middle; transform-box: fill-box; transform-origin: center; }
.cell .cc { font-size: 25px; transition: opacity .08s, transform .14s var(--spring); }
.cell .cc.space { font-size: 12px; letter-spacing: .12em; opacity: .5; }
.cell .sw { font-size: 13px; opacity: .42; transition: opacity .08s, transform .14s var(--spring), fill .08s; }
.cell.lit .ticks { opacity: .95; stroke: var(--live); }
.cell.lit .sw { opacity: .75; }
.cell text.hot { fill: var(--live); opacity: 1; transform: scale(1.7); }
.cell .cc.hot { transform: scale(1.18); }
.cell.lit.away .cc { opacity: .25; }
.strail { stroke: var(--live); stroke-width: 1.5; stroke-dasharray: 4 6; stroke-linecap: round; opacity: .7; }

footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; font-size: 11px; }
.stats { opacity: .65; font-variant-numeric: tabular-nums; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; }
.tbtn { font: 11px var(--mono); color: var(--ink); background: none; border: 0; padding: 6px 6px; cursor: pointer; opacity: .75; touch-action: manipulation; }
.tbtn:hover { opacity: 1; }
.tbtn[aria-pressed="true"] { color: var(--live); opacity: 1; }
.tbtn:focus-visible, .chip:focus-visible { outline: 1px dashed var(--live); outline-offset: 2px; }
.dwell { font-variant-numeric: tabular-nums; opacity: .75; }

#overlay { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 40; overflow: visible; }
#overlay text { font-family: var(--mono); font-size: 11px; fill: var(--ink); paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; }
.ring { transition: opacity .2s, transform .24s var(--ease); }
.ring.past { opacity: .28; }
.ring.out { opacity: 0; transform: scale(.7); }
.ring.commit { opacity: 0; transform: scale(1.14); }
.ring.nope { animation: nope .28s; }
@keyframes nope { 30% { translate: -5px 0; } 65% { translate: 4px 0; } }
.ring .dead { fill: none; stroke: var(--ink); stroke-dasharray: 3 5; opacity: .5; }
.ring .cross { stroke: var(--ink); opacity: .6; fill: none; }
.node { animation: node-in .26s var(--spring) both; animation-delay: calc(var(--i) * 24ms); }
@keyframes node-in { from { opacity: 0; transform: scale(.45); } to { opacity: 1; transform: none; } }
.node .lead { stroke: var(--ink); opacity: .3; transition: opacity .1s, stroke .1s; }
.node .gate { fill: none; stroke: var(--live); stroke-width: 2; opacity: 0; transition: opacity .1s; }
.node .lbl { opacity: .65; transition: opacity .1s, fill .1s; }
.node .dot { fill: var(--ink); }
.node .more { fill: none; stroke: var(--ink); stroke-dasharray: 3 5; opacity: .55; }
.node .keyr { fill: var(--paper); stroke: var(--ink); opacity: .9; }
#overlay .node .keyt { font-size: 10px; stroke-width: 0; }
.node.hot .lead { stroke: var(--live); opacity: .9; }
.node.hot .gate { opacity: .85; }
.node.hot .lbl { opacity: 1; fill: var(--live); }
.node.hot .dot { fill: var(--live); }
.trail { fill: none; stroke: var(--live); stroke-width: 1.5; stroke-dasharray: 4 6; stroke-linecap: round; opacity: .35; }
.trail-head { fill: var(--live); opacity: .5; }
#trailG { transition: opacity .3s; }
#trailG.fade { opacity: 0; }
.drawn .trail { opacity: .8; }
.drawn .trail-head { opacity: .9; }
#overlay #preview text { font-size: 13px; fill: var(--live); font-weight: 500; }

#flash {
  position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 54px); translate: -50% 0; z-index: 45;
  font-size: 12px; padding: 4px 10px; pointer-events: none; opacity: 0; white-space: nowrap; color: var(--ink);
  background:
    linear-gradient(var(--live), var(--live)) left top / 6px 1px no-repeat,
    linear-gradient(var(--live), var(--live)) left top / 1px 6px no-repeat,
    linear-gradient(var(--live), var(--live)) right bottom / 6px 1px no-repeat,
    linear-gradient(var(--live), var(--live)) right bottom / 1px 6px no-repeat,
    var(--paper);
}
#flash.on { animation: flash 1.7s var(--ease); }
#flash .badge { color: var(--live); }
@keyframes flash { 0% { opacity: 0; translate: -50% 6px; } 10%, 70% { opacity: 1; translate: -50% 0; } 100% { opacity: 0; } }

.fly { position: fixed; left: 0; top: 0; z-index: 46; pointer-events: none; font: 500 16px var(--mono); color: var(--live); }

@media (prefers-reduced-motion: reduce) {
  #plane, .tile, .ring, .node, .cell text { transition: none !important; animation: none !important; }
  #flash.on { animation-duration: .01s; opacity: 1; }
}
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="brand">
      <svg class="logo" viewBox="0 0 52 54" role="img" aria-label="not-padgtp">
        <text x="2" y="9">N</text><text x="12" y="9">o</text><text x="22" y="9">t</text>
        <text x="22" y="20">p</text><text x="32" y="20">a</text><text x="42" y="20">d</text>
        <text x="42" y="31">G</text><text x="42" y="42">T</text><text x="42" y="53">P</text>
      </svg>
      <span class="brand-name">path lab</span>
    </div>
    <div class="hint" id="hint"></div>
  </header>
  <div id="testBar" hidden></div>
  <main id="view" aria-label="Tiles"><div id="plane"></div></main>
  <div id="suggest"></div>
  <div id="surface" hidden><svg id="surfSvg" aria-hidden="true"></svg></div>
  <footer>
    <span class="stats" id="stats"></span>
    <span class="controls">
      <button class="tbtn" id="dwellDown" type="button" aria-label="Shorter dwell">−</button>
      <span class="dwell" id="dwellVal"></span>
      <button class="tbtn" id="dwellUp" type="button" aria-label="Longer dwell">+</button>
      <button class="tbtn" id="hapticsBtn" type="button"></button>
      <button class="tbtn" id="surfaceBtn" type="button">Keys</button>
      <button class="tbtn" id="testBtn" type="button">WPM test</button>
    </span>
  </footer>
</div>
<svg id="overlay" aria-hidden="true"><g id="rings"></g><g id="trailG"><path class="trail" id="trail"/><path class="trail-head" id="trailHead"/></g><g id="preview"></g></svg>
<div id="flash" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";
const $ = (s) => document.querySelector(s);
const coarse = matchMedia("(pointer: coarse)").matches;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const KEY = "notpad-pathlab-v1";
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const f = (v) => (Math.round(v * 2) / 2).toString();

// ---------- State ----------
function seed() {
  return {
    tiles: [
      { id: 1, x: 0, y: 0, text: "Hold anywhere on this tile, then drag.\n\nPause and the x-ray draws the paths. Move without stopping and nothing is drawn: that is the expert path. Release on an action to run it. Come back to where you started to cancel.\n\nTry it: hold, drag right, then right again." },
      { id: 2, x: 1, y: 0, text: "You moved right.\n\nMove is the path that goes right. Its four directions are the four directions you can move. Hold, drag right, then down." },
      { id: 3, x: 1, y: 1, text: "Below.\n\nTile is the path that goes up: it opens new tiles around this one. View goes left: try View, then left again, for the map." }
    ],
    focus: 1, nextId: 4,
    prefs: {}, results: [], stats: {}
  };
}
let state = null;
try { const raw = localStorage.getItem(KEY); state = raw ? JSON.parse(raw) : null; } catch { state = null; }
if (!state || !Array.isArray(state.tiles) || !state.tiles.length) state = seed();
state.prefs = Object.assign({ dwell: 220, haptics: true, surface: coarse, size: 19 }, state.prefs || {});
state.stats = Object.assign({ paths: 0, eyesFree: 0, cancels: 0 }, state.stats || {});
state.results = Array.isArray(state.results) ? state.results : [];
if (!state.tiles.some((t) => t.id === state.focus)) state.focus = state.tiles[0].id;

let saveTimer = 0;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} }, 300);
}
let mapMode = false;
const tile = (id = state.focus) => state.tiles.find((t) => t.id === id);

const app = $("#app"), view = $("#view"), plane = $("#plane"), overlay = $("#overlay");
const ringsEl = $("#rings"), trailG = $("#trailG"), trailEl = $("#trail"), trailHead = $("#trailHead"), previewEl = $("#preview");
const surface = $("#surface"), surfSvg = $("#surfSvg"), suggestEl = $("#suggest"), testBar = $("#testBar"), flashEl = $("#flash");

function haptic(ms) {
  if (!state.prefs.haptics) return;
  try { navigator.vibrate?.(ms); } catch {}
}

function flash(message, eyesFree) {
  flashEl.innerHTML = esc(message) + (eyesFree ? ' <span class="badge">· eyes-free</span>' : "");
  flashEl.classList.remove("on");
  void flashEl.offsetWidth;
  flashEl.classList.add("on");
}

// ---------- The plane of tiles ----------
const tileEls = new Map();
let geo = { W: 0, H: 0, G: 16, vw: 0, vh: 0 };

function makeTile(t) {
  const el = document.createElement("div");
  el.className = "tile";
  el.dataset.id = String(t.id);
  el.innerHTML = '<div class="tile-head"></div><div class="tile-body"></div>';
  return el;
}

function planeTransform() {
  const { W, H, G, vw, vh } = geo;
  if (mapMode) {
    const xs = state.tiles.map((t) => t.x), ys = state.tiles.map((t) => t.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
    const bw = (maxX - minX + 1) * (W + G) - G, bh = (maxY - minY + 1) * (H + G) - G;
    const s = Math.min(0.5, (vw - 40) / bw, (vh - 40) / bh);
    const cx = minX * (W + G) + bw / 2, cy = minY * (H + G) + bh / 2;
    plane.style.setProperty("--s", String(s));
    return `translate(${vw / 2 - s * cx}px, ${vh / 2 - s * cy}px) scale(${s})`;
  }
  const t = tile();
  plane.style.setProperty("--s", "1");
  const cx = t.x * (W + G) + W / 2, cy = t.y * (H + G) + H / 2;
  return `translate(${vw / 2 - cx}px, ${vh / 2 - cy}px) scale(1)`;
}

function layoutPlane() {
  const vw = view.clientWidth, vh = view.clientHeight, G = 16;
  const W = vw < 700 ? vw - 36 : Math.min(640, vw * 0.62);
  const H = Math.max(120, vh - 24);
  geo = { W, H, G, vw, vh };
  for (const t of state.tiles) {
    let el = tileEls.get(t.id);
    if (!el) { el = makeTile(t); plane.append(el); tileEls.set(t.id, el); }
    el.style.width = W + "px";
    el.style.height = H + "px";
    el.style.left = t.x * (W + G) + "px";
    el.style.top = t.y * (H + G) + "px";
    el.classList.toggle("focused", t.id === state.focus);
  }
  for (const [id, el] of tileEls) if (!state.tiles.some((t) => t.id === id)) { el.remove(); tileEls.delete(id); }
  view.classList.toggle("map", mapMode);
  plane.style.transform = planeTransform();
  renderAllText();
}

function renderText(t) {
  const el = tileEls.get(t.id);
  if (!el) return;
  const first = t.text.split("\n").find((line) => line.trim()) || "Empty tile";
  el.firstChild.textContent = first.length > 48 ? first.slice(0, 47) + "…" : first;
  const body = el.lastChild;
  body.innerHTML = esc(t.text) + (t.id === state.focus ? '<span class="caret"></span>' : "");
  if (t.id === state.focus) body.scrollTop = body.scrollHeight;
}
function renderAllText() { for (const t of state.tiles) renderText(t); }

function nudge(dx, dy) {
  if (reduced) return;
  const base = plane.style.transform;
  plane.animate(
    [{ transform: base }, { transform: `${base} translate(${dx * 18}px, ${dy * 18}px)` }, { transform: base }],
    { duration: 300, easing: "cubic-bezier(.3,1.6,.5,1)" }
  );
}

// ---------- Editing ----------
const hist = new Map();
function histOf(id) {
  let h = hist.get(id);
  if (!h) { h = { undo: [], redo: [], at: 0 }; hist.set(id, h); }
  return h;
}
function edit(fn, coalesce) {
  const t = tile();
  const h = histOf(t.id);
  const now = performance.now();
  if (!coalesce || now - h.at > 1000) { h.undo.push(t.text); if (h.undo.length > 300) h.undo.shift(); }
  h.at = coalesce ? now : 0;
  h.redo.length = 0;
  t.text = fn(t.text);
  renderText(t);
  scheduleSave();
}
function undo() {
  const t = tile(), h = histOf(t.id);
  if (!h.undo.length) return "Nothing to undo";
  h.redo.push(t.text); t.text = h.undo.pop(); h.at = 0;
  renderText(t); renderSuggest(); scheduleSave();
  return null;
}
function redo() {
  const t = tile(), h = histOf(t.id);
  if (!h.redo.length) return "Nothing to redo";
  h.undo.push(t.text); t.text = h.redo.pop(); h.at = 0;
  renderText(t); renderSuggest(); scheduleSave();
  return null;
}
const currentText = () => (test.on ? test.buf : tile().text);
const shouldCap = (text) => /(?:^|[.!?] |\n)$/.test(text);

function typeChar(ch, source, autoCap) {
  if (test.on) { testType(ch, source); return; }
  if (autoCap && /[a-z]/.test(ch) && shouldCap(tile().text)) ch = ch.toUpperCase();
  edit((text) => text + ch, true);
  renderSuggest();
}
function backspace() {
  if (test.on) { test.buf = Array.from(test.buf).slice(0, -1).join(""); renderTest(); renderSuggest(); return; }
  if (!tile().text) return;
  edit((text) => Array.from(text).slice(0, -1).join(""), true);
  renderSuggest();
}
function newline() {
  if (test.on) { finishPhrase(); return; }
  edit((text) => text + "\n", false);
  renderSuggest();
}

// ---------- Commands: the only behaviour a path can reach ----------
let closeArmedAt = 0;
function occupied(x, y) { return state.tiles.some((t) => t.x === x && t.y === y); }
function newTile(dx, dy) {
  const from = tile(), tx = from.x + dx, ty = from.y + dy;
  if (occupied(tx, ty)) {
    for (const t of state.tiles) {
      if (dx && t.y === from.y && (dx > 0 ? t.x >= tx : t.x <= tx)) t.x += dx;
      if (dy && t.x === from.x && (dy > 0 ? t.y >= ty : t.y <= ty)) t.y += dy;
    }
  }
  const t = { id: state.nextId++, x: tx, y: ty, text: "" };
  state.tiles.push(t);
  state.focus = t.id;
  mapMode = false;
  layoutPlane(); renderSuggest(); scheduleSave();
  return null;
}
function closeTile() {
  if (state.tiles.length === 1) return "The last tile stays";
  const t = tile();
  const now = performance.now();
  if (t.text.trim() && now - closeArmedAt > 3000) {
    closeArmedAt = now;
    return "This tile has text. Close it again within 3 s to confirm";
  }
  closeArmedAt = 0;
  state.tiles = state.tiles.filter((other) => other.id !== t.id);
  for (const other of state.tiles) if (other.y === t.y && other.x > t.x) other.x -= 1;
  let best = null, bestScore = Infinity;
  for (const other of state.tiles) {
    const score = Math.abs(other.x - t.x) + Math.abs(other.y - t.y) * 1.5;
    if (score < bestScore) { bestScore = score; best = other; }
  }
  state.focus = best.id;
  hist.delete(t.id);
  layoutPlane(); renderSuggest(); scheduleSave();
  return "Tile closed";
}
function moveFocus(dx, dy) {
  const from = tile();
  let best = null, bestScore = Infinity;
  for (const t of state.tiles) {
    const ax = t.x - from.x, ay = t.y - from.y;
    const along = ax * dx + ay * dy;
    if (along <= 0) continue;
    const across = Math.abs(ax * dy) + Math.abs(ay * dx);
    const score = along + across * 2;
    if (score < bestScore) { bestScore = score; best = t; }
  }
  if (!best) {
    nudge(dx, dy);
    return "Nothing " + (dx > 0 ? "to the right" : dx < 0 ? "to the left" : dy < 0 ? "above" : "below");
  }
  state.focus = best.id;
  mapMode = false;

// ---------- The path tree: one tree for touch, mouse, and keys ----------
const DIRS = ["E", "SE", "S", "SW", "W", "NW", "N", "NE"];
const VEC = Object.fromEntries(DIRS.map((d, i) => [d, [Math.cos(i * Math.PI / 4), Math.sin(i * Math.PI / 4)]]));
const dirOf = (dx, dy) => DIRS[((Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) % 8) + 8) % 8];

const tree = { label: "", children: {
  N: { label: "Tile", key: "t", children: {

    W: { label: "New left", key: "h", cmd: "tile.newLeft" },

// ---------- The path engine ----------
const R_DEAD = 16, R_SELECT = 44, R_RING = 92;

  trailGen++;

  requestAnimationFrame(tick);
}
const topLevel = () => g.levels[g.levels.length - 1];

function pushLevel(node, x, y) {
  const prev = g.levels.length ? topLevel() : null;
  if (prev?.ring) prev.ring.classList.add("past");
  const level = { node, ox: x, oy: y, ring: null, hot: null };
  g.levels.push(level);

}

  g.stillAt = performance.now();
  setPreview(null);
}

function tick() {
  if (!g) return;
  const level = topLevel();
  if (!level.ring && performance.now() - g.stillAt >= state.prefs.dwell) {
    g.drawn = true;
    overlay.classList.add("drawn");
    app.classList.add("quiet");
    showRing(level);
  }

}

function moveGesture(x, y) {
  g.moved = Math.max(g.moved, Math.hypot(x - g.trail[0][0], y - g.trail[0][1]));
  const last = g.trail[g.trail.length - 1];
  if (Math.hypot(x - last[0], y - last[1]) > 3) { g.trail.push([x, y]); drawTrail(); }
  if (Math.hypot(x - g.stillX, y - g.stillY) > 7) { g.stillX = x; g.stillY = y; g.stillAt = performance.now(); }
  g.x = x; g.y = y;

    const parent = g.levels[g.levels.length - 2];
    if (Math.hypot(x - parent.ox, y - parent.oy) < R_DEAD + 8) { popLevel(); haptic(4); return; }
  }
  const level = topLevel();
  const dx = x - level.ox, dy = y - level.oy, d = Math.hypot(dx, dy);
  const dir = d > R_DEAD ? dirOf(dx, dy) : null;
  const node = dir ? level.node.children[dir] : null;
  setHot(level, node ? dir : null);
  if (d >= R_SELECT && node) {
    if (node.children) { setPreview(null); pushLevel(node, x, y); haptic(6); return; }
    if (g.armed !== dir) { g.armed = dir; haptic(4); }

    setPreview(null);

function endGesture(cancelled) {

  const level = done.levels[done.levels.length - 1];
  const node = !cancelled && done.armed ? level.node.children[done.armed] : null;
  if (node) {
    const crumbs = done.levels.slice(1).map((l) => l.node.label).concat(node.label);
    state.stats.paths++;
    if (!done.drawn) state.stats.eyesFree++;
    for (const l of done.levels) if (l.ring) finishRing(l.ring, l === level ? "commit" : "out");
    haptic(12);
    const message = commands[node.cmd]?.();
    flash(message || crumbs.join(" › "), !done.drawn && !message);
  } else {
    for (const l of done.levels) if (l.ring) finishRing(l.ring, "out");

    if (tap) tapAt(done.x, done.y);

  trailG.classList.add("fade");
  setTimeout(() => { if (gen === trailGen) { trailEl.setAttribute("d", ""); trailHead.setAttribute("d", ""); } }, 320);

// ---------- Pointer paths on the plane ----------
view.addEventListener("pointerdown", (e) => {

// ---------- Keyboard paths: hold Alt, then letters or arrows ----------

// ---------- The typing surface: drawn glyphs, tap or swipe ----------
// Tap a large glyph to type it. Press it and swipe toward a small glyph to type that one.
const CELLS = [

  { c: "n", s: { S: "y" } },
  { c: "i", s: { SW: "b", NE: "!" } },
  { c: "h", s: { E: "v" } },
  { c: "o", s: { N: "u", S: "d", W: "l", E: "c", NW: "m", NE: "f", SW: "p", SE: "g" } },
  { c: "r", s: { W: "k" } },
  { c: "t", s: { NE: "x", SW: "'" } },
  { c: "e", s: { N: "j" } },
  { c: "s", s: { NW: "q", E: "z" } },

    : { x: 0, y: rowH * 3, w, h: spaceH });

    markup += `<g class="cell" data-i="${i}"><path class="ticks" d="${ticks}"/>`;
    markup += cell.space
      ? `<text class="cc space" x="${f(cx)}" y="${f(cy + 4)}">space</text>`
      : `<text class="cc" x="${f(cx)}" y="${f(cy + 9)}">${esc(cell.c)}</text>`;

  setTarget(p, target);
  p.line.setAttribute("x1", f(p.x0 - p.box.left)); p.line.setAttribute("y1", f(p.y0 - p.box.top));
  p.line.setAttribute("x2", f(e.clientX - p.box.left)); p.line.setAttribute("y2", f(e.clientY - p.box.top));
  if (cell.space && target === "W") {
    if (!p.rep && !p.int) p.rep = setTimeout(() => { p.repeated = true; backspace(); haptic(3); p.int = setInterval(() => { backspace(); haptic(2); }, 70); }, 450);
  } else if (p.rep || p.int) stopRepeat(p);
  void geo;
});
function releasePress(e, commit) {
  const p = presses.get(e.pointerId);
  if (!p) return;
  presses.delete(e.pointerId);
  stopRepeat(p);
  const cell = CELLS[p.i];
  const el = cellEl(p.i);
  let glyphEl = null, out = null;
  if (commit && p.target === "C") { out = cell.c; glyphEl = el.querySelector(".cc"); }
  else if (commit && p.target && p.target !== "X") { out = cell.s[p.target]; glyphEl = el.querySelector(`.sw[data-dir="${p.target}"]`); }
  el.classList.remove("lit", "away");
  el.querySelectorAll(".hot").forEach((n) => n.classList.remove("hot"));
  p.line.remove();
  if (!out || (p.repeated && p.target === "W")) return;
  haptic(5);
  if (out === "⌫") backspace();
  else if (out === "⏎") newline();
  else if (out === " ") typeChar(" ", "surface", false);
  else { typeChar(out, "surface", true); fly(glyphEl, out); }
}
surface.addEventListener("pointerup", (e) => releasePress(e, true));
surface.addEventListener("pointercancel", (e) => releasePress(e, false));
surface.addEventListener("contextmenu", (e) => e.preventDefault());

function caretEl() {
  return test.on ? testBar.querySelector(".caret") : plane.querySelector(".tile.focused .caret");
}
function fly(fromEl, glyph) {
  if (reduced || !fromEl) return;
  const caret = caretEl();
  if (!caret) return;
  const a = fromEl.getBoundingClientRect(), b = caret.getBoundingClientRect();
  const span = document.createElement("span");
  span.className = "fly";
  span.textContent = glyph;
  document.body.append(span);
  const sx = a.left + a.width / 2 - 5, sy = a.top + a.height / 2 - 10;
  const ex = b.left - 5, ey = b.top;
  span.animate([
    { transform: `translate(${sx}px, ${sy}px) scale(1.4)`, opacity: 1 },
    { transform: `translate(${ex}px, ${ey}px) scale(.8)`, opacity: 0 }
  ], { duration: 190, easing: "cubic-bezier(.3,.7,.4,1)" }).onfinish = () => span.remove();
}

// ---------- Word completions, drawn as marked chips ----------
const WORDS = ("the of and to a in is it you that he was for on are with as i his they be at one have this from or had by not word but what some we can out other were all there when up use your how said an each she which do their time if will way about many then them write would like so these her long make thing see him two has look more day could go come did number sound no most people my over know water than call first who may down side been now find any new work part take get place made live where after back little only round man year came show every good me give our under name very through just form sentence great think say help low line differ turn cause much mean before move right boy old too same tell does set three want air well also play small end put home read hand port large spell add even land here must big high such follow act why ask men change went light kind off need house picture try us again animal point mother world near build self earth father tile tiles path paths hold release drag pause expert action actions note notes canvas keys key layer quiet editor thought clear map habit habits practice smooth paper pen ink weight arrange later open").split(" ");
function renderSuggest() {
  suggestEl.replaceChildren();
  if (!state.prefs.surface) return;
  const m = /[A-Za-z']+$/.exec(currentText());
  if (!m) return;
  const prefix = m[0], lower = prefix.toLowerCase();
  const seen = new Set();
  const list = WORDS.filter((w) => w.startsWith(lower) && w !== lower && !seen.has(w) && seen.add(w)).slice(0, 3);
  for (const word of list) {
    const shown = /[A-Z]/.test(prefix[0]) ? word[0].toUpperCase() + word.slice(1) : word;
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = shown;
    b.addEventListener("pointerdown", (ev) => { ev.preventDefault(); complete(prefix.length, shown); });
    b.addEventListener("click", (ev) => { if (ev.detail === 0) complete(prefix.length, shown); });
    suggestEl.append(b);
  }
}
function complete(n, word) {
  haptic(6);
  if (test.on) {
    if (test.start === null) test.start = performance.now();
    test.src.add("surface");
    test.buf = test.buf.slice(0, test.buf.length - n) + word + " ";
    renderTest(); renderSuggest(); checkAuto();
    return;
  }
  edit((text) => text.slice(0, text.length - n) + word + " ", false);
  renderSuggest();
}

// ---------- WPM test ----------
const PHRASES = [
  "hold the key and follow the path",
  "every hint carries its key",
  "the canvas never ends",
  "write first and arrange later",
  "a small editor with a quiet layer",
  "type until the thought is clear",
  "the map shows where you are",
  "release to commit the action",
  "slow is smooth and smooth is fast",
  "the paper waits for the pen",
  "one ink one weight one line",
  "move right and open a new tile",
  "the best tool gets out of the way",
  "practice turns paths into habits",
  "a quiet page is a good page"
];
const test = { on: false, i: 0, buf: "", start: null, src: new Set(), phrase: "" };
function nextPhrase(advance) {
  if (advance) test.i = (test.i + 1) % PHRASES.length;
  test.phrase = PHRASES[test.i];
  test.buf = ""; test.start = null; test.src = new Set();
}
function toggleTest() {
  test.on = !test.on;
  if (test.on) { test.i = Math.floor(Math.random() * PHRASES.length); nextPhrase(false); }
  app.classList.toggle("testing", test.on);
  renderTest(); renderSuggest(); renderControls();
  requestAnimationFrame(layoutPlane);
  return test.on ? "WPM test: type the phrase. It ends when it matches, or on ⏎" : "WPM test off";
}
function testType(ch, source) {
  if (test.start === null) test.start = performance.now();
  test.src.add(source);
  test.buf += ch;
  renderTest(); renderSuggest(); checkAuto();
}
function checkAuto() { if (test.buf.trimEnd().toLowerCase() === test.phrase) finishPhrase(); }
function lev(a, b) {
  const row = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    let prev = row[0]; row[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const tmp = row[j];
      row[j] = Math.min(row[j] + 1, row[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = tmp;
    }
  }
  return row[b.length];
}
function finishPhrase() {
  const typed = test.buf.trimEnd();
  if (!typed || test.start === null) return;
  const secs = (performance.now() - test.start) / 1000;
  const wpm = secs > 0 ? ((typed.length - 1) / 5) / (secs / 60) : 0;
  const acc = 1 - lev(typed.toLowerCase(), test.phrase) / Math.max(typed.length, test.phrase.length);
  const src = test.src.has("surface") ? "surface" : "keyboard";
  state.results.push({ wpm: Math.round(wpm * 10) / 10, acc: Math.round(acc * 1000) / 10, src, at: Date.now() });
  if (state.results.length > 300) state.results.shift();
  scheduleSave();
  flash(`${wpm.toFixed(1)} wpm · ${Math.round(acc * 100)}% accurate · ${src}`);
  nextPhrase(true);
  renderTest(); renderSuggest();
}
const median = (xs) => { const s = [...xs].sort((a, b) => a - b); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
function renderTest() {
  testBar.hidden = !test.on;
  if (!test.on) return;
  const typed = test.buf.toLowerCase();
  let target = "";
  Array.from(test.phrase).forEach((ch, i) => {
    const cls = i < typed.length ? (typed[i] === ch ? "ok" : "bad") : i === typed.length ? "next" : "";
    target += `<span class="${cls}">${esc(ch)}</span>`;
  });
  const parts = [];
  for (const src of ["surface", "keyboard"]) {
    const rs = state.results.filter((r) => r.src === src);
    if (rs.length) parts.push(`${src}: median ${median(rs.map((r) => r.wpm)).toFixed(1)} wpm, ${median(rs.map((r) => r.acc)).toFixed(0)}% over ${rs.length}`);
  }
  testBar.innerHTML = `<div class="target">${target}</div>`
    + `<div class="typed">${esc(test.buf)}<span class="caret"></span></div>`
    + `<div class="summary">${parts.length ? esc(parts.join(" · ")) : "No results yet. Timing starts at your first letter."}</div>`;
}

// ---------- Footer ----------
function renderStats() {
  const s = state.stats;
  $("#stats").textContent = `${s.paths} paths · ${s.eyesFree} eyes-free · ${s.cancels} cancelled`;
}
function renderControls() {
  $("#dwellVal").textContent = `dwell ${state.prefs.dwell} ms`;
  const hb = $("#hapticsBtn");
  hb.textContent = state.prefs.haptics ? "Haptics on" : "Haptics off";
  hb.setAttribute("aria-pressed", String(state.prefs.haptics));
  $("#surfaceBtn").setAttribute("aria-pressed", String(state.prefs.surface));
  $("#testBtn").setAttribute("aria-pressed", String(test.on));
}
$("#dwellDown").addEventListener("click", () => { state.prefs.dwell = clamp(state.prefs.dwell - 40, 60, 900); renderControls(); scheduleSave(); });
$("#dwellUp").addEventListener("click", () => { state.prefs.dwell = clamp(state.prefs.dwell + 40, 60, 900); renderControls(); scheduleSave(); });
$("#hapticsBtn").addEventListener("click", () => { state.prefs.haptics = !state.prefs.haptics; haptic(10); renderControls(); scheduleSave(); });
$("#surfaceBtn").addEventListener("click", () => flash(toggleSurface()));
$("#testBtn").addEventListener("click", () => flash(toggleTest()));

$("#hint").innerHTML = coarse
  ? "Hold on the tile, <b>drag</b>, release. Pause to see the paths."
  : "Hold <b>Alt</b> and press letters or arrows, or hold the mouse and <b>drag</b>. Pause to see the paths.";

// ---------- Boot ----------
function sizeOverlay() {
  overlay.setAttribute("width", String(innerWidth));
  overlay.setAttribute("height", String(innerHeight));
}
document.documentElement.style.setProperty("--text-size", state.prefs.size + "px");
sizeOverlay();
layoutSurface();
layoutPlane();
renderStats();
renderControls();
renderSuggest();
addEventListener("resize", sizeOverlay);
new ResizeObserver(() => layoutPlane()).observe(view);
new ResizeObserver(() => layoutSurface()).observe(surface);
})();
</script>
