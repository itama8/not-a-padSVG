<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>not-padgtp path lab v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<style>
/* Layout: Notepad first. The screen is one note of plain text. A thin bar at the bottom is where paths start; the
   typing strip slides up under it only while typing. The x-ray is a fixed SVG over everything, empty until you hesitate. */
:root {
  --paper: #e8ebe5;
  --ink: #1b201d;
  --x: #4a3ec2;
  --text: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.23, 1, .32, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #121513; --ink: #dce1d8; --x: #ada2ff; color-scheme: dark; }
}
:root[data-theme="dark"] { --paper: #121513; --ink: #dce1d8; --x: #ada2ff; color-scheme: dark; }

html { height: 100%; box-sizing: border-box; }
body { height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); overscroll-behavior: none; font-family: var(--ui); }
*, *::before, *::after { box-sizing: border-box; }

#app { height: 100%; display: flex; flex-direction: column; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }

/* ---------- The note ---------- */
#view { flex: 1; min-height: 0; position: relative; overflow: hidden; }
#page {
  position: absolute; inset: 0; overflow-y: auto; touch-action: pan-y; cursor: text;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 40vh;
  transition: opacity .18s;
}
#text {
  max-width: 68ch; margin: 0 auto; white-space: pre-wrap; overflow-wrap: anywhere;
  font: 400 17px/1.6 var(--text); min-height: 1.6em;
}
#text mark { background: color-mix(in srgb, var(--x) 20%, transparent); color: inherit; border-radius: 2px; }
.caret { position: relative; display: inline; }
.caret::after {
  content: ""; position: absolute; left: -1px; top: -0.05em; width: 2px; height: 1.3em; background: var(--ink);
  animation: blink 1.1s steps(1) infinite;
}
.typing .caret::after { animation: none; }
@keyframes blink { 50% { opacity: 0; } }
.ghost { opacity: .38; border-bottom: 1px dashed currentColor; cursor: pointer; }
.xr #page { opacity: .16; }

/* Neighbour notes: a hairline on the edge they lie beyond. */
.edge { position: absolute; background: var(--ink); opacity: .28; pointer-events: none; transition: opacity .2s; }
.edge[hidden] { display: none; }
.edge.w { left: 3px; top: calc(50% - 18px); width: 1.5px; height: 36px; }
.edge.e { right: 3px; top: calc(50% - 18px); width: 1.5px; height: 36px; }
.edge.n { top: 3px; left: calc(50% - 18px); height: 1.5px; width: 36px; }
.edge.s { bottom: 3px; left: calc(50% - 18px); height: 1.5px; width: 36px; }

/* ---------- Map ---------- */
#map { position: absolute; inset: 0; background: var(--paper); overflow: auto; touch-action: pan-x pan-y; }
#mapInner { position: relative; margin: 0 auto; }
.card {
  position: absolute; padding: 10px; overflow: hidden; cursor: pointer;
  font: 400 9px/1.45 var(--text); white-space: pre-wrap; color: var(--ink);
  border: 1px solid color-mix(in srgb, var(--ink) 22%, transparent); background: var(--paper);
}
.card.focus { border: 1.5px solid var(--x); }
.card b { display: block; font: 500 11px/1.3 var(--ui); margin-bottom: 4px; }
#mapCap { position: sticky; top: 0; padding: 14px 16px 8px; font: 400 13px var(--ui); color: var(--x); opacity: .8; text-align: center; background: var(--paper); z-index: 1; }

/* ---------- The bar: the one place paths start on touch ---------- */
#rail { position: relative; flex: none; height: 30px; touch-action: none; cursor: grab; display: grid; place-items: center; }
#rail::before { content: ""; position: absolute; inset: 0 0 auto; height: 1px; background: color-mix(in srgb, var(--ink) 14%, transparent); }
.grip { width: 44px; height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--ink) 34%, transparent); transition: width .2s var(--ease); }
.kept .grip { width: 64px; background: repeating-linear-gradient(-45deg, var(--x) 0 1.5px, transparent 1.5px 4.5px); border: 1px solid var(--x); }
.held .grip { width: 64px; background: var(--x); }
#rail:focus-visible { outline: 2px solid var(--x); outline-offset: -3px; }

/* ---------- Typing strip ---------- */
#keys { flex: none; touch-action: none; padding-bottom: 4px; }
#keys[hidden] { display: none; }
.krows {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 560px; margin: 0 auto;
}
.krow { display: grid; grid-template-columns: repeat(10, 1fr); height: 44px; }
.k { position: relative; display: grid; place-items: center; font: 400 21px/1 var(--text); color: var(--ink); border-radius: 6px; }
.k sup { position: absolute; top: 4px; right: 3px; font: 400 10px/1 var(--text); opacity: .42; }
.k.fn { font-family: var(--ui); font-size: 19px; opacity: .7; }
.k.down { background: color-mix(in srgb, var(--ink) 9%, transparent); }
.cap .k.l { text-transform: uppercase; }
.space { height: 30px; margin: 2px 0 0; display: flex; align-items: center; justify-content: center; gap: 16px; font: 400 12px var(--ui); color: var(--ink); opacity: .55; border-top: 1px solid color-mix(in srgb, var(--ink) 12%, transparent); }
.space.down { background: color-mix(in srgb, var(--ink) 9%, transparent); }
#pop {
  position: fixed; z-index: 30; min-width: 54px; height: 58px; padding: 0 12px; display: grid; place-items: center; pointer-events: none;
  font: 400 30px/1 var(--text); color: var(--ink); background: var(--paper);
  border: 1px solid color-mix(in srgb, var(--ink) 30%, transparent); border-radius: 10px;
  transform: translate(-50%, -100%);
}
#pop.word { font-size: 20px; }

/* ---------- X-ray ---------- */
#xray { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; overflow: visible; }
#xray * { vector-effect: non-scaling-stroke; }
#xray path, #xray circle, #xray line, #xray rect { fill: none; stroke: var(--x); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
#xray text { fill: var(--x); stroke: var(--paper); stroke-width: 6px; paint-order: stroke; stroke-linejoin: round; }
.dead, .cross { opacity: .35; }
.gate { opacity: .35; }
.lead { opacity: 0; }
#xray .dot { fill: var(--x); stroke: none; }
.more { opacity: .55; }
.lbl { font: 400 17px var(--ui); opacity: .66; }
.ul { opacity: 0; }
.node { animation: nodeIn .16s var(--ease) both; animation-delay: calc(var(--i) * 18ms); }
@keyframes nodeIn { from { opacity: 0; transform: scale(.88); } }
.node.hot .lbl { opacity: 1; }
.node.hot .ul, .node.hot .lead { opacity: .9; }
.node.hot .gate { opacity: 1; }
.node.off .lbl { opacity: .2; }
.node.off .dot, .node.off .gate, .node.off .more { opacity: .18; }
.node.pred .lbl { opacity: 1; }
.keyr { opacity: .8; }
#xray .keyt { font: 500 12px var(--text); stroke-width: 0; }
.ring { transition: opacity .2s; }
.ring.past { opacity: .2; }
.ring.past .node:not(.hot) .lbl { display: none; }
.ring.out { opacity: 0; transition: opacity .25s; }
.ring.commit .node.hot .lbl { animation: commit .3s var(--ease); }
@keyframes commit { 40% { opacity: 1; font-size: 20px; } }
.route { stroke-dasharray: 3 5; opacity: .85; }
.rlbl { font: 400 15px var(--ui); }
.rkey { font: 500 12px var(--text); opacity: .75; }
#xray .trail { stroke-dasharray: 4 6; opacity: .6; }
#xray .head { fill: var(--x); stroke: none; opacity: .8; }
.fade { opacity: 0; transition: opacity .3s; }
.cap1 { font: 400 15px var(--ui); }

#xhead {
  position: fixed; z-index: 21; left: 0; right: 0; top: env(safe-area-inset-top, 0px); pointer-events: none;
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px;
  font: 400 12px/1.3 var(--text); color: var(--x); opacity: 0; transition: opacity .15s; font-variant-numeric: tabular-nums;
}
.xr #xhead { opacity: .9; }
#xhead svg { flex: none; }
#xhead svg rect { fill: none; stroke: var(--x); stroke-width: 1; }
#xhead svg rect.f { fill: var(--x); }

#toast {
  position: fixed; z-index: 22; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 10px); transform: translateX(-50%);
  font: 400 14px var(--ui); color: var(--x); background: var(--paper); padding: 4px 10px; border-radius: 6px;
  opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap;
}
#toast.on { opacity: 1; transition: none; }

#hints {
  position: fixed; z-index: 19; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 8px; pointer-events: none; opacity: 0; transition: opacity .2s;
}
#hints.on { opacity: 1; }
#hints.on .hint { pointer-events: auto; }
.hint {
  display: inline-flex; align-items: baseline; gap: 8px; padding: 6px 10px; cursor: pointer;
  font: 400 15px var(--ui); color: var(--x); background: var(--paper);
  border: 1px solid color-mix(in srgb, var(--x) 45%, transparent); border-radius: 7px;
}
.hint .r { font: 400 15px var(--text); letter-spacing: .08em; }
.hint kbd { font: 500 11px var(--text); opacity: .75; }
.hint:focus-visible { outline: 2px solid var(--x); }

@media (prefers-reduced-motion: reduce) {
  .node, .ring.commit .node.hot .lbl { animation: none; }
  .caret::after { animation: none; }
}
</style>
</head>
<body>

<div id="app">
  <div id="view">
    <div id="page"><div id="text"></div></div>
    <div class="edge w" hidden></div><div class="edge e" hidden></div><div class="edge n" hidden></div><div class="edge s" hidden></div>
    <div id="map" hidden><div id="mapCap">Map · tap a note to open it</div><div id="mapInner"></div></div>
  </div>
  <div id="rail" tabindex="0" aria-label="Path bar. Hold to show paths. Tap to show or hide keys. Double-tap to keep the x-ray on."><span class="grip"></span></div>
  <div id="keys" hidden><div class="krows" id="krows"></div><div class="space" id="space"><span>space</span><span>swipe → space · ← delete · ↑ symbol · ↓ capital · ↗ accept</span></div></div>
</div>
<svg id="xray" aria-hidden="true"><g id="routes"></g><g id="rings"></g><g id="trailG"><path class="trail" id="trail"></path><path class="head" id="head"></path></g><g id="demo"></g></svg>
<div id="xhead"><span id="xl"></span><span id="xr"></span></div>
<div id="toast" role="status"></div>
<div id="hints"></div>
<div id="pop" hidden></div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const f = (n) => Math.round(n * 10) / 10;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const now = () => performance.now();
const fine = matchMedia("(pointer: fine)").matches;

const app = $("#app"), view = $("#view"), page = $("#page"), textEl = $("#text"), rail = $("#rail"), keysEl = $("#keys");
const ringsEl = $("#rings"), routesEl = $("#routes"), demoEl = $("#demo"), trailEl = $("#trail"), headEl = $("#head"), trailG = $("#trailG");
const toastEl = $("#toast"), hintsEl = $("#hints"), popEl = $("#pop"), mapEl = $("#map"), mapInner = $("#mapInner");

const WORDS = ("the of and to a in is it you that he was for on are with as i his they be at one have this from or had by not word but what some we can out other were all there when up use your how said an each she which do their time if will way about many then them write would like so these her long make thing see him two has look more day could go come did number sound no most people my over know water than call first who may down side been now find any new work part take get place made live where after back little only round man year came show every good me give our under name very through just form sentence great think say help low line differ turn cause much mean before move right boy old too same tell does set three want air well also play small end put home read hand port large spell add even land here must big high such follow act why ask men change went light kind off need house picture try us again animal point mother world near build self earth father tile tiles path paths hold release drag pause expert action actions note notes canvas keys key layer quiet editor thought clear map habit habits practice smooth paper pen ink weight arrange later open").split(" ");

// ---------- State ----------
const KEY = "notpad-pathlab-v2";
const WELCOME = `Welcome to not-padgtp

This screen is just text. Tap anywhere to type.

Hold the bar at the bottom. After a moment the x-ray draws the paths you can follow. Slide toward one and let go.

Once you know a path, don't wait. Hold and slide in one move, and nothing gets drawn.

  ← Undo        → Redo
  ↖ Select ›    ↑ Note ›    ↗ Edit ›

Double-tap the bar to keep the x-ray on. It suggests the next path, and tapping a suggestion shows you how to draw it.

Swipe sideways on the text to walk to the next note.

On a computer, hold Alt and press letters, or right-drag anywhere.
`;
function seed() {
  const g = "Groceries\n\noat milk\nrye bread\nlemons\ncoffee beans\n";
  const i = "Ideas for the canvas\n\nA canvas is a folder of .txt files plus one layout file.\nNotes sit on a grid. Swipe sideways to walk a row.\nNote › Map shows the whole grid.\n";
  return {
    notes: [
      { id: 1, x: 0, y: 0, text: WELCOME, caret: 0 },
      { id: 2, x: 1, y: 0, text: g, caret: g.length },
      { id: 3, x: 0, y: 1, text: i, caret: i.length }
    ],
    focus: 1, nextId: 4, kept: false, clip: "",
    stats: { paths: 0, eyesFree: 0, cancels: 0, taught: 0, chars: 0, typingMs: 0 }
  };
}
let state;
try { state = JSON.parse(localStorage.getItem(KEY)); } catch { state = null; }
if (!state || !Array.isArray(state.notes) || !state.notes.length) state = seed();
for (const n of state.notes) n.anchor = null;

let saveT = 0;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try {
      localStorage.setItem(KEY, JSON.stringify({ ...state, notes: state.notes.map(({ id, x, y, text, caret }) => ({ id, x, y, text, caret })) }));
    } catch {}
  }, 300);
}

const hists = new Map();
const hist = (id) => { if (!hists.has(id)) hists.set(id, { u: [], r: [], kind: null, at: 0 }); return hists.get(id); };
const cur = () => state.notes.find((n) => n.id === state.focus) || state.notes[0];
const selRange = (n) => n.anchor == null ? [n.caret, n.caret] : [Math.min(n.caret, n.anchor), Math.max(n.caret, n.anchor)];
const hasSel = () => { const [a, b] = selRange(cur()); return b > a; };
const snap = (n) => ({ text: n.text, caret: n.caret, anchor: n.anchor });

let lastEdit = 0, lastKind = null, lastCmd = null, closed = [], keysOn = false, mapOpen = false;

function edit(fn, kind) {
  const n = cur(), h = hist(n.id), t = now();
  if (!(kind && h.kind === kind && t - h.at < 1200)) { h.u.push(snap(n)); if (h.u.length > 300) h.u.shift(); }
  h.r.length = 0; h.kind = kind; h.at = t;
  fn(n);
  lastEdit = t; lastKind = kind; lastCmd = null; closed.length = 0;
  render(); save(); poke();
}
function insertText(s, kind = "type") {
  edit((n) => { const [a, b] = selRange(n); n.text = n.text.slice(0, a) + s + n.text.slice(b); n.caret = a + s.length; n.anchor = null; }, kind);
}
function backspace(word) {
  const n = cur(), [a, b] = selRange(n);
  if (a === b && a === 0) return;
  edit((n) => {
    let s = a;
    if (a === b) {
      s = a - 1;
      if (word) { while (s > 0 && /\s/.test(n.text[s])) s--; while (s > 0 && !/\s/.test(n.text[s - 1])) s--; }
    }
    n.text = n.text.slice(0, s) + n.text.slice(b); n.caret = s; n.anchor = null;
  }, "del");
}
function delForward() {
  const n = cur(), [a, b] = selRange(n);
  if (a === b && a >= n.text.length) return;
  edit((n) => { n.text = n.text.slice(0, a) + n.text.slice(a === b ? a + 1 : b); n.caret = a; n.anchor = null; }, "del");
}
const isWord = (c) => !!c && /[\p{L}\p{N}'_-]/u.test(c);
function wordAt(n, i) {
  let s = i, e = i;
  while (s > 0 && isWord(n.text[s - 1])) s--;
  while (e < n.text.length && isWord(n.text[e])) e++;
  return [s, e];
}
function lineAt(n, i) {
  const s = n.text.lastIndexOf("\n", i - 1) + 1;
  let e = n.text.indexOf("\n", i); if (e < 0) e = n.text.length;
  return [s, e];
}
function paraAt(n, i) {
  const t = n.text;
  let s = i; while (s > 0 && !(t[s - 1] === "\n" && (s < 2 || t[s - 2] === "\n"))) s--;
  let e = i; while (e < t.length && !(t[e] === "\n" && t[e + 1] === "\n")) e++;
  return [s, e];
}
function selectRange(a, b) { const n = cur(); n.anchor = a; n.caret = b; render(); }

// ---------- Commands ----------
function setClip(s) {
  state.clip = s;
  try { navigator.clipboard?.writeText(s).catch(() => {}); } catch {}
}
const commands = {
  undo() {
    if (lastCmd === "close" && closed.length) { restoreClosed(); return "Note restored"; }
    const n = cur(), h = hist(n.id);
    if (!h.u.length) return "Nothing to undo";
    h.r.push(snap(n)); Object.assign(n, h.u.pop()); h.kind = null; render(); save(); return "Undone";
  },
  redo() {
    const n = cur(), h = hist(n.id);
    if (!h.r.length) return "Nothing to redo";
    h.u.push(snap(n)); Object.assign(n, h.r.pop()); h.kind = null; render(); save(); return "Redone";
  },
  selWord() { const n = cur(); const [s, e] = wordAt(n, n.caret); if (e > s) selectRange(s, e); return "Word"; },
  selLine() { const n = cur(); const [s, e] = lineAt(n, n.caret); selectRange(s, e); return "Line"; },
  selPara() { const n = cur(); const [s, e] = paraAt(n, n.caret); selectRange(s, e); return "Paragraph"; },
  selAll() { selectRange(0, cur().text.length); return "All"; },
  selNone() { cur().anchor = null; render(); return "Selection cleared"; },
  copy() { const n = cur(), [a, b] = selRange(n); setClip(n.text.slice(a, b)); return "Copied"; },
  cut() { const n = cur(), [a, b] = selRange(n); setClip(n.text.slice(a, b)); insertText("", "cut"); return "Cut"; },
  paste() { insertText(state.clip, "paste"); return "Pasted"; },
  delLine() {
    const n = cur(); let [s, e] = lineAt(n, n.caret);
    if (e < n.text.length) e++; else if (s > 0) s--;
    edit((n) => { n.text = n.text.slice(0, s) + n.text.slice(e); n.caret = Math.min(s, n.text.length); n.anchor = null; }, "line");
    return "Line deleted";
  },
  find() {
    const n = cur(); let [a, b] = selRange(n);
    if (a === b) [a, b] = wordAt(n, n.caret);
    const q = n.text.slice(a, b); if (!q) return "No word here";
    let i = n.text.indexOf(q, b); if (i < 0) i = n.text.indexOf(q);
    selectRange(i, i + q.length);
    return i === a ? "Only match" : "Next match";
  },
  map() { openMap(); return null; },
  newRight() { addNote(1, 0); return "New note →"; },
  newBelow() { addNote(0, 1); return "New note ↓"; },
  close() { return closeNote(); },
  reset() {
    if (now() - (commands.reset.armed || 0) > 3000) { commands.reset.armed = now(); return "Do it again to reset the lab"; }
    try { localStorage.removeItem(KEY); } catch {}
    state = seed(); hists.clear(); closed = []; for (const n of state.notes) n.anchor = null;
    closeMap(true); render(); save(); return "Lab reset";
  }
};
const enabled = {
  undo: () => (lastCmd === "close" && closed.length > 0) || hist(cur().id).u.length > 0,
  redo: () => hist(cur().id).r.length > 0,
  copy: hasSel, cut: hasSel, selNone: hasSel,
  paste: () => !!state.clip,
  selWord: () => { const n = cur(); const [s, e] = wordAt(n, n.caret); return e > s; },
  find: () => { const n = cur(); if (hasSel()) return true; const [s, e] = wordAt(n, n.caret); return e > s; },
  delLine: () => cur().text.length > 0
};

const tree = { label: "", children: {
  W: { label: "Undo", key: "z", cmd: "undo" },
  NW: { label: "Select", key: "s", children: {
    NW: { label: "Word", key: "w", cmd: "selWord" },
    N: { label: "Line", key: "l", cmd: "selLine" },
    W: { label: "Paragraph", key: "p", cmd: "selPara" },
    NE: { label: "All", key: "a", cmd: "selAll" },
    E: { label: "None", key: "n", cmd: "selNone" }
  } },
  N: { label: "Note", key: "n", children: {
    N: { label: "Map", key: "m", cmd: "map" },
    E: { label: "New →", key: "l", cmd: "newRight" },
    NE: { label: "New ↓", key: "j", cmd: "newBelow" },
    NW: { label: "Close", key: "x", cmd: "close" },
    W: { label: "Reset lab", key: "0", cmd: "reset" }
  } },
  NE: { label: "Edit", key: "e", children: {
    NE: { label: "Paste", key: "v", cmd: "paste" },
    N: { label: "Copy", key: "c", cmd: "copy" },
    NW: { label: "Cut", key: "x", cmd: "cut" },
    E: { label: "Find next", key: "f", cmd: "find" },

  const line = document.createElementNS(SVGNS, "path"); line.setAttribute("class", "trail"); demoEl.append(line);
  const pts = [[cx, cy]];
  let x = cx, y = cy;
  (async () => {
    let ring = r1, node = tree;
    for (let i = 0; i < P.dirs.length; i++) {
      const d = P.dirs[i];
      await step(() => {}, i ? 260 : 380);
      const len = P.dirs[i + 1] ? R_SELECT * 1.3 : R_VIS;
      x += VEC[d][0] * len; y += VEC[d][1] * len; pts.push([x, y]);
      await step(() => {
        line.setAttribute("d", "M" + pts.map((p) => `${f(p[0])} ${f(p[1])}`).join("L"));
        ring.querySelector(`.node[data-dir="${d}"]`)?.classList.add("hot");
      }, 0);
      node = node.children[d];
      if (node.children) {
        await step(() => { ring.classList.add("past"); ring = drawRing(node, x, y, keys); demoEl.append(ring); }, 300);
      }
    }
    await step(() => ring.classList.add("commit"), 200);
    await step(() => { demoEl.classList.add("fade"); }, 1400);
    await step(() => { demoEl.textContent = ""; demoEl.classList.remove("fade"); app.classList.remove("xr"); demoBusy = false; poke(); }, 320);
  })();
}

// ---------- X-ray header: the old debug chrome lives here now ----------
function updateHead() {
  if (!app.classList.contains("xr")) return;
  const n = cur(), s = state.stats;
  const title = (n.text.split("\n")[0] || "Untitled").slice(0, 26);
  const words = (n.text.match(/\S+/g) || []).length;
  const wpm = s.typingMs > 4000 ? Math.round(s.chars / 5 / (s.typingMs / 60000)) : "–";
  const xs = state.notes.map((m) => m.x), ys = state.notes.map((m) => m.y);
  const x0 = Math.min(...xs), y0 = Math.min(...ys);

  $("#xl").innerHTML = `${esc(title)} · ${words} words`;

// ---------- The bar ----------
let railTapT = 0, railLast = 0;
function railTap() {
  const t = now();
  if (t - railLast < 320) {
    clearTimeout(railTapT); railLast = 0;
    state.kept = !state.kept; app.classList.toggle("kept", state.kept);
    toast(state.kept ? "X-ray kept on" : "X-ray off"); save(); poke();
    return;
  }
  railLast = t;
  railTapT = setTimeout(() => showKeys(!keysOn), 260);
}
rail.addEventListener("pointerdown", (e) => {
  if (g || (e.pointerType === "mouse" && e.button !== 0)) return;
  e.preventDefault();
  try { rail.setPointerCapture(e.pointerId); } catch {}
  startGesture(e.pointerType === "mouse" ? "mouse" : "touch", e.clientX, e.clientY, e.pointerId, "rail");
});
for (const el of [rail, view]) {
  el.addEventListener("pointermove", (e) => { if (g && g.pointerId === e.pointerId) moveGesture(e.clientX, e.clientY); });
  el.addEventListener("pointerup", (e) => { if (g && g.pointerId === e.pointerId) endGesture(false); });
  el.addEventListener("pointercancel", (e) => { if (g && g.pointerId === e.pointerId) endGesture(true); });
}
rail.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); showKeys(!keysOn); } });

// ---------- The note: tap for caret, swipe sideways to walk, right-drag for paths ----------
let tp = null;
view.addEventListener("contextmenu", (e) => e.preventDefault());
page.addEventListener("pointerdown", (e) => {
  if (g) return;
  poke();
  if (e.pointerType === "mouse" && e.button === 2) {
    e.preventDefault();
    try { view.setPointerCapture(e.pointerId); } catch {}
    startGesture("mouse", e.clientX, e.clientY, e.pointerId, "view");
    return;
  }
  if (e.pointerType === "mouse" && e.button !== 0) return;
  if (e.target.classList.contains("ghost")) { acceptCompletion(); e.preventDefault(); return; }
  tp = { id: e.pointerId, x: e.clientX, y: e.clientY, mouse: e.pointerType === "mouse", dx: 0 };
  if (tp.mouse) {
    e.preventDefault();
    const o = offsetAt(e.clientX, e.clientY);
    if (o != null) { const n = cur(); if (e.shiftKey) { if (n.anchor == null) n.anchor = n.caret; } else n.anchor = null; n.caret = o; lastKind = null; render(); }
    try { page.setPointerCapture(e.pointerId); } catch {}
  }
});
page.addEventListener("pointermove", (e) => {
  if (!tp || tp.id !== e.pointerId) return;
  if (tp.mouse) {
    if (!(e.buttons & 1)) return;
    const o = offsetAt(e.clientX, e.clientY), n = cur();
    if (o != null && o !== n.caret) { if (n.anchor == null) n.anchor = n.caret; n.caret = o; if (n.anchor === n.caret) n.anchor = null; render(); }
    return;
  }
  tp.dx = e.clientX - tp.x;
  const dy = e.clientY - tp.y;
  if (Math.abs(tp.dx) > 12 && Math.abs(tp.dx) > Math.abs(dy)) page.style.transform = `translateX(${f(tp.dx * 0.5)}px)`;
});
page.addEventListener("pointerup", (e) => {
  if (!tp || tp.id !== e.pointerId) return;
  const t = tp; tp = null;
  if (t.mouse) { save(); return; }
  const dx = e.clientX - t.x, dy = e.clientY - t.y;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.4) {
    const n = neighbour(dx < 0 ? 1 : -1, 0);
    if (n) { go(n, dx < 0 ? 1 : -1, 0); return; }
  }
  page.style.transform = "";
  if (Math.hypot(dx, dy) < 10) {
    const o = offsetAt(e.clientX, e.clientY);
    if (o != null) { const n = cur(); n.caret = o; n.anchor = null; lastKind = null; render(); save(); }

    setTimeout(scrollCaret, 240);
  }
});
page.addEventListener("pointercancel", () => { tp = null; page.style.transform = ""; });

// ---------- Map ----------
function openMap() {
  mapOpen = true; showKeys(false); mapEl.hidden = false; clearHints();
  const xs = state.notes.map((n) => n.x), ys = state.notes.map((n) => n.y);
  const x0 = Math.min(...xs), y0 = Math.min(...ys), cols = Math.max(...xs) - x0 + 1, rows = Math.max(...ys) - y0 + 1;
  const W = clamp((view.clientWidth - 32 - (cols - 1) * 12) / cols, 90, 170), H = W * 1.3;
  mapInner.style.width = (cols * W + (cols - 1) * 12) + "px";
  mapInner.style.height = (rows * H + (rows - 1) * 12 + 24) + "px";
  mapInner.innerHTML = state.notes.map((n) => {
    const [first, ...rest] = n.text.split("\n");
    return `<div class="card${n.id === state.focus ? " focus" : ""}" data-id="${n.id}" style="left:${(n.x - x0) * (W + 12)}px;top:${(n.y - y0) * (H + 12)}px;width:${W}px;height:${H}px"><b>${esc(first || "Untitled")}</b>${esc(rest.join("\n").slice(0, 260))}</div>`;
  }).join("");
}
function closeMap(silent) { mapOpen = false; mapEl.hidden = true; if (!silent) render(); }
mapEl.addEventListener("click", (e) => {
  const c = e.target.closest(".card");
  if (c) { state.focus = Number(c.dataset.id); save(); }
  closeMap(); page.scrollTop = 0;
});

// ---------- Typing strip ----------
const ROWS = [
  ["qwertyuiop", "1234567890"],
  ["asdfghjkl⌫", "-/+=()$&@ "],
  ["zxcvbnm,.⏎", "!?'\"#%*;: "]
];
$("#krows").innerHTML = ROWS.map(([r, s]) => `<div class="krow">${[...r].map((c, i) => {
  const fn = c === "⌫" || c === "⏎";
  const sec = s[i] && s[i] !== " " && !fn ? `<sup>${esc(s[i])}</sup>` : "";
  return `<div class="k${fn ? " fn" : ""}${/[a-z]/.test(c) ? " l" : ""}" data-c="${esc(c)}" data-s="${esc(fn ? "" : s[i].trim())}">${esc(c)}${sec}</div>`;
}).join("")}</div>`).join("");
const spaceEl = $("#space");
function showKeys(on) {
  if (mapOpen && on) return;
  keysOn = on && !mapOpen; keysEl.hidden = !keysOn;
  if (state.kept) placeHints();
}
function autoCap() {
  const n = cur(); if (n.anchor != null) return false;
  const before = n.text.slice(0, n.caret);
  return before === "" || /(^|[.!?]\s+|\n)$/.test(before);
}
function updateCase() { keysEl.classList.toggle("cap", autoCap()); }
let lastCharAt = 0;
function typed(ch) {
  const t = now();
  if (t - lastCharAt < 2000) state.stats.typingMs += t - lastCharAt;
  lastCharAt = t; state.stats.chars++;
  app.classList.add("typing"); clearTimeout(typed.t); typed.t = setTimeout(() => app.classList.remove("typing"), 600);
  insertText(ch, "type");
  scrollCaret();
}
function acceptCompletion() {
  if (!ghostRest) return false;
  const rest = ghostRest;
  insertText(rest + " ", "type"); lastKind = "accept"; render(); scrollCaret();
  return true;
}
function classify(dx, dy) {
  const ax = Math.abs(dx), ay = Math.abs(dy);
  if (ax < 16 && ay < 16) return "tap";
  if (dx > 18 && dy < -18 && ax < ay * 2.2 && ay < ax * 2.2) return "ne";
  if (ax >= ay) return ax > 26 ? (dx > 0 ? "space" : "back") : "tap";

}
const presses = new Map();
function keyAt(x, y) {
  const r = $("#krows").getBoundingClientRect();
  if (y > r.bottom) return { space: true };
  const rows = [...document.querySelectorAll(".krow")];
  const row = rows.find((el) => y < el.getBoundingClientRect().bottom) || rows[rows.length - 1];
  const ks = [...row.children], rr = row.getBoundingClientRect();

  return { el: ks[i] };
}
function glyphFor(p, kind) {
  if (kind === "space") return "␣";
  if (kind === "back") return Math.abs(p.dx) > 120 ? "⌫ word" : "⌫";
  if (kind === "ne") return ghostRest ? cur().text.slice(wordAt(cur(), cur().caret)[0], cur().caret) + ghostRest : "";
  if (p.space) return "␣";
  const c = p.el.dataset.c;
  if (c === "⌫" || c === "⏎") return c;
  if (kind === "alt") return p.el.dataset.s || "";
  const up = autoCap();
  if (kind === "case") return up ? c : c.toUpperCase();
  return up && /[a-z]/.test(c) ? c.toUpperCase() : c;
}
function showPop(p, kind) {
  const g0 = glyphFor(p, kind);
  if (!g0) { popEl.hidden = true; return; }
  const r = (p.space ? spaceEl : p.el).getBoundingClientRect();
  popEl.textContent = g0; popEl.classList.toggle("word", g0.length > 2);
  popEl.style.left = clamp(r.left + r.width / 2, 40, innerWidth - 40) + "px";
  popEl.style.top = (r.top - 8) + "px";
  popEl.hidden = false;
}
keysEl.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  try { keysEl.setPointerCapture(e.pointerId); } catch {}
  const k = keyAt(e.clientX, e.clientY);
  const p = { ...k, x: e.clientX, y: e.clientY, dx: 0, dy: 0, kind: "tap" };
  presses.set(e.pointerId, p);
  (p.space ? spaceEl : p.el).classList.add("down");
  if (!p.space && p.el.dataset.c === "⌫") {
    backspace(); p.fired = true;
    p.rep = setTimeout(() => { p.int = setInterval(() => backspace(), 60); }, 420);
  }
  showPop(p, "tap");
  clearHints();
});
keysEl.addEventListener("pointermove", (e) => {
  const p = presses.get(e.pointerId); if (!p) return;
  p.dx = e.clientX - p.x; p.dy = e.clientY - p.y;
  const kind = classify(p.dx, p.dy);
  if (kind !== "tap" && p.rep) { clearTimeout(p.rep); clearInterval(p.int); p.rep = 0; }
  if (kind !== p.kind || kind === "back") { p.kind = kind; showPop(p, kind); }
});
function releaseKey(e, commit) {
  const p = presses.get(e.pointerId); if (!p) return;
  presses.delete(e.pointerId);
  clearTimeout(p.rep); clearInterval(p.int);
  (p.space ? spaceEl : p.el).classList.remove("down");
  popEl.hidden = true;
  if (!commit) return;
  const kind = classify(p.dx, p.dy);
  if (kind === "space") return typed(" ");
  if (kind === "back") return backspace(Math.abs(p.dx) > 120);
  if (kind === "ne") { acceptCompletion(); return; }
  if (p.space) return typed(" ");
  const c = p.el.dataset.c;
  if (c === "⌫") { if (!p.fired) backspace(); return; }
  if (c === "⏎") return typed("\n");
  if (kind === "alt") { if (p.el.dataset.s) typed(p.el.dataset.s); return; }
  typed(glyphFor(p, kind));
}
keysEl.addEventListener("pointerup", (e) => releaseKey(e, true));
keysEl.addEventListener("pointercancel", (e) => releaseKey(e, false));

// ---------- Desktop keyboard: type normally; hold Alt for paths ----------
function codeChar(code) {
  if (code.startsWith("Key")) return code.slice(3).toLowerCase();
  if (code.startsWith("Digit")) return code.slice(5);
  return null;
}
const ARROWDIR = { ArrowLeft: "W", ArrowUp: "N", ArrowRight: "E" };
function keyStep(e) {
  if (e.key === "Escape") { endGesture(true); return; }
  const level = topLevel();

  if (!dir) {
    const ch = codeChar(e.code);
    dir = Object.keys(level.node.children).find((d) => level.node.children[d].key === ch);
  }
  const node = dir && level.node.children[dir];
  if (!node || !isOn(node)) { haptic(2); return; }
  setHot(level, dir);
  if (node.children) { pushLevel(node, level.ox, level.oy, dir); return; }
  g.armed = dir;
  endGesture(false);
}
function moveCaret(n, to, shift) {

  n.caret = clamp(to, 0, n.text.length);
  if (n.anchor === n.caret) n.anchor = null;
  lastKind = null; render(); scrollCaret(); save();
}
addEventListener("keydown", (e) => {
  if (e.key === "Alt") { e.preventDefault(); if (!g && !e.repeat && !mapOpen) startGesture("keys", 0, 0, null, "keys"); return; }
  if (g && g.input === "keys") { e.preventDefault(); if (!e.repeat) keyStep(e); return; }
  if (g) return;
  if (mapOpen) { if (e.key === "Escape") closeMap(); return; }
  if (e.target === rail || e.target.closest?.(".hint")) return;
  const n = cur(), mod = e.ctrlKey || e.metaKey;
  if (mod) {
    const k = e.key.toLowerCase();
    if (e.altKey) return;
    if (k === "z" && !e.shiftKey) { e.preventDefault(); toast(commands.undo()); lastCmd = "undo"; }
    else if (k === "y" || (k === "z" && e.shiftKey)) { e.preventDefault(); toast(commands.redo()); lastCmd = "redo"; }
    else if (k === "a") { e.preventDefault(); commands.selAll(); }
    poke(); return;
  }
  const [a, b] = selRange(n);
  let handled = true;
  switch (e.key) {
    case "Backspace": backspace(e.ctrlKey); break;
    case "Delete": delForward(); break;
    case "Enter": typed("\n"); break;
    case "Tab": if (!acceptCompletion()) typed("  "); break;
    case "ArrowLeft": moveCaret(n, !e.shiftKey && b > a ? a : n.caret - 1, e.shiftKey); break;
    case "ArrowRight": moveCaret(n, !e.shiftKey && b > a ? b : n.caret + 1, e.shiftKey); break;
    case "ArrowUp": case "ArrowDown": {
      const [x, y] = caretPoint(), lh = parseFloat(getComputedStyle(textEl).lineHeight) || 27;

      moveCaret(n, o == null ? (e.key === "ArrowUp" ? 0 : n.text.length) : o, e.shiftKey); break;
    }
    case "Home": moveCaret(n, lineAt(n, n.caret)[0], e.shiftKey); break;
    case "End": moveCaret(n, lineAt(n, n.caret)[1], e.shiftKey); break;
    case "Escape": if (n.anchor != null) { n.anchor = null; render(); } else handled = false; break;
    default:
      if (e.key.length === 1) typed(e.key); else handled = false;
  }

});
addEventListener("keyup", (e) => { if (e.key === "Alt" && g?.input === "keys") { e.preventDefault(); endGesture(false); } });
addEventListener("blur", () => { if (g) endGesture(true); });
document.addEventListener("copy", (e) => { const n = cur(), [a, b] = selRange(n); if (b > a) { e.preventDefault(); state.clip = n.text.slice(a, b); e.clipboardData?.setData("text/plain", state.clip); toast("Copied"); } });
document.addEventListener("cut", (e) => { const n = cur(), [a, b] = selRange(n); if (b > a) { e.preventDefault(); state.clip = n.text.slice(a, b); e.clipboardData?.setData("text/plain", state.clip); insertText("", "cut"); } });
document.addEventListener("paste", (e) => { const t = e.clipboardData?.getData("text/plain"); if (t) { e.preventDefault(); insertText(t.replace(/\r\n?/g, "\n"), "paste"); scrollCaret(); } });
addEventListener("resize", () => { if (state.kept) placeHints(); if (mapOpen) openMap(); });

// ---------- Boot ----------
app.classList.toggle("kept", !!state.kept);
render();
if (cur().id === 1 && cur().caret === 0) page.scrollTop = 0;
poke();
