<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>Desktop scatter lab · not-padgtp</title>
  <style>
    :root { color-scheme: light dark; font: 14px/1.5 ui-monospace, monospace; }
    body { max-width: 1280px; margin: 24px auto; padding: 0 16px; }
    header { display: flex; align-items: baseline; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px; }
    h1 { margin: 0; font-size: 18px; }
    form { display: flex; align-items: end; flex-wrap: wrap; gap: 12px 20px; margin: 16px 0; }
    label { display: grid; min-width: 124px; }
    button, select { font: inherit; min-height: 34px; }
    input[type="range"] { margin: 0; min-height: 34px; }
    output { font-variant-numeric: tabular-nums; }
    #status { margin: 8px 0 0; font-size: 12px; }
    #stage { aspect-ratio: 8 / 5; position: relative; overflow: hidden; outline: 1px solid GrayText; }
    iframe { position: absolute; inset: 0; width: 1280px; height: 800px; border: 0; transform-origin: top left; }
  </style>
  <script defer src="../scatter-layout.js"></script>
  <script defer src="scatter.js"></script>
</head>
<body>
  <header>
    <h1>Desktop scatter lab</h1>
    <nav aria-label="Labs">
      <a href="keyboard.html">Keyboard lab</a>
      <a href="tiles.html">Tile artwork</a>
    </nav>
  </header>
  <form>
    <label>Mood
      <select id="mood">
        <option value="loose">Loose</option>
        <option value="swarm">Swarm</option>
        <option value="drift">Drift</option>
        <option value="ring">Ring</option>
      </select>
    </label>
    <label for="steps"><span>Relaxation <output for="steps" id="steps-value"></output></span>
      <input id="steps" type="range" min="0" max="4" step="1">
    </label>
    <label for="density"><span>Density <output for="density" id="density-value"></output></span>
      <input id="density" type="range" min="0" max="100" step="5">
    </label>
    <label for="balance"><span>Balance tolerance <output for="balance" id="balance-value"></output></span>
      <input id="balance" type="range" min="5" max="25" step="1">
    </label>
    <button type="button" id="new-seed">New seed</button>
  </form>
  <div id="stage">
    <iframe id="preview" src="../index.html" title="Desktop x-ray layout preview" inert></iframe>
  </div>
  <p id="status" role="status">Loading the x-ray preview…</p>
</body>
</html>
