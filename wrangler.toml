name = "not-padgtp-counter"
main = "counter/worker.mjs"
compatibility_date = "2026-11-23"
workers_dev = true
preview_urls = false

[vars]
SITE_ORIGIN = "https://itama8.github.io"

[assets]
directory = "./site"
run_worker_first = ["/api/want", "/api/want/session"]

[[durable_objects.bindings]]
name = "WANT_COUNTER"
class_name = "WantCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WantCounter"]
